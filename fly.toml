app = "vela-ai-medical"
primary_region = "nrt"   # 東京，離台灣最近

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsudmVsYS5hbi10aG8uY29tJA"
  NEXT_PUBLIC_POSTHOG_KEY = "phc_b9toDT6nkPhQxRpabYsT6vSUEAWGha8HQbVxkaaNthW"
  NEXT_PUBLIC_POSTHOG_HOST = "https://app.posthog.com"
  NEXT_PUBLIC_API_URL = "https://vela.an-tho.com"
  NEXT_PUBLIC_LOCALE_HINT_ENABLED = "true"
  NEXT_PUBLIC_SENTRY_DSN = ""  # Fill in your Sentry DSN
  NEXT_PUBLIC_ARCHIVE_MODE = "true"  # archive car 2026-10-05 — frontend archive banner / hidden routes (Dockerfile ARG+ENV)

[env]
  SENTRY_DSN = ""  # Fill in your Sentry DSN
  ARCHIVE_MODE = "true"  # archive car 2026-10-05 — 410 on the retired API surface; Research stays up, writes no history
  ANON_DAILY_BUDGET_USD = "0.5"  # archive car 2026-10-05 — anonymous aggregate cap (code default 2.00, Decision 001 A7)

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
